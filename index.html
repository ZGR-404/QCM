<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار QCM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--pr:#2f5fd0;--prt:#fff;--ok:#1e9e4f;--okb:#e1f5e9;--bad:#d1342f;--badb:#fbe5e4;--sel:#e6edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 "Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 14px;line-height:1.6}
p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
label.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
label.row small{display:block;color:var(--mu);font-size:14px}
input{accent-color:var(--pr);width:20px;height:20px;margin-top:5px;flex:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:11px 22px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:15px;margin-bottom:8px}
.track{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
#bar{height:100%;width:0;background:var(--pr);transition:width .3s}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.sel{background:var(--sel);border-color:var(--pr)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{background:var(--badb);border-color:var(--bad)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--tx)}
.feedback{margin-top:14px;padding:13px 15px;border-radius:10px;background:var(--okb);border:1px solid var(--ok);white-space:pre-wrap}.feedback strong{display:block;margin-bottom:5px}.feedback.wrong{background:var(--badb);border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:14px 0}
.stats div{background:var(--bg);border-radius:12px;padding:12px 4px}
.stats strong{display:block;font-size:26px}.g{color:var(--ok)}.r{color:var(--bad)}
.big{font-size:44px;font-weight:700;text-align:center;margin:0}
.rev{border-inline-start:5px solid var(--bd)}.rev.ok{border-color:var(--ok)}.rev.bad{border-color:var(--bad)}
h2#qt,.rev h3{white-space:pre-line}
.rev h3{font-size:17px;margin:0 0 10px}
.rev .opt{padding:8px 12px;margin-bottom:6px;font-size:16px}
.tag{font-size:13px;margin-inline-start:auto;flex:none;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>اختبار QCM</h1>
  <p class="sub" id="total"></p>
  <div class="card">
    <h2>نوع الاختبار</h2>
    <label class="row"><input type="radio" name="deck" value="clerk" checked><span>محرر قضائي<small>80 سؤالاً، يمكن اختيار أكثر من جواب.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="police"><span>ضابط شرطة<small>50 سؤالاً، جواب واحد لكل سؤال.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="sn"><span>نموذج عام: مباراة الأمن الوطني<small>200 سؤال، جواب واحد لكل سؤال، ثقافة عامة وقانون.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="db"><span>Data Base<small>400 سؤال حول MySQL، جواب واحد لكل سؤال، مع التصحيح والتفسير.</small></span></label>
  </div>
  <div class="card">
    <h2>طريقة الاختبار</h2>
    <label class="row"><input type="radio" name="mode" value="practice" checked><span>وضع التدريب<small>يظهر اللون الأخضر أو الأحمر فور اختيارك للجواب، مع إظهار الجواب الصحيح.</small></span></label>
    <label class="row"><input type="radio" name="mode" value="exam"><span>وضع الامتحان<small>لا يظهر أي تصحيح أثناء الاختبار، ويُعرض كل شيء في النهاية.</small></span></label>
  </div>
  <div class="card">
    <h2>الخلط</h2>
    <label class="row"><input type="checkbox" id="sq" checked><span>خلط ترتيب الأسئلة</span></label>
    <label class="row"><input type="checkbox" id="so" checked><span>خلط ترتيب الاختيارات</span></label>
  </div>
  <button class="btn" id="go" style="width:100%;font-size:18px">ابدأ الاختبار</button>
</section>

<section id="quiz" hidden>
  <div class="meta"><span id="cnt"></span><span id="md"></span></div>
  <div class="track"><div id="bar"></div></div>
  <p class="sub" id="hint" style="margin:0 0 10px" hidden>يمكن اختيار أكثر من جواب، ثم اضغط «تأكيد الجواب» في وضع التدريب.</p>
  <div class="card"><h2 id="qt"></h2><div id="opts"></div><div id="feedback" class="feedback" hidden></div></div>
  <div class="nav"><button class="btn ghost" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
</section>

<section id="result" hidden>
  <div class="card">
    <p class="big" id="pct"></p>
    <p style="text-align:center;margin:0;color:var(--mu)" id="msg"></p>
    <div class="stats">
      <div><strong id="sc"></strong>النتيجة</div>
      <div><strong class="g" id="cn"></strong>صحيحة</div>
      <div><strong class="r" id="wn"></strong>خاطئة</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="retry">إعادة الاختبار</button><button class="btn ghost" id="settings">تغيير الإعدادات</button></div>
  </div>
  <h2>التصحيح</h2>
  <label class="row" style="padding-top:0"><input type="checkbox" id="onlyw"><span>إظهار الأسئلة الخاطئة فقط</span></label>
  <div id="rev"></div>
</section>
</main>
<script>
const DB={"clerk":{"name":"محرر قضائي","multi":true,"fix":true,"q":[{"q":"يثار الدفع بعدم الاختصاص المكاني في طور الاستئناف:","o":["بالنسبة للأحكام الحضورية","بالنسبة للأحكام النهائية","بالنسبة للأحكام الغيابية","جميع الأجوبة خاطئة"],"a":[2]},{"q":"يجب أن تبلغ إلى النيابة العامة بمجرد تقييدها الدعاوى:","o":["المتعلقة بمخاصمة القضاة","المتعلقة بعدم الاختصاص النوعي","المتعلقة بتنازع القوانين","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تتضمن الأحكام القضائية وجوبا البيانات التالية:","o":["باسم جلالة الملك وطبقا للقانون","المحكمة المصدرة للحكم","اسم كاتب الضبط","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"الدفع بعدم الاختصاص المكاني أمام المحكمة الابتدائية:","o":["يمكن إثارته تلقائيا من طرف المحكمة المختصة","يشترط أن يثار قبل كل دفع أو دفاع في الجوهر","يشترط بيان المحكمة المختصة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"يسلم الاستدعاء مرفقا بنسخة من مقال الدعوى إلى الشخص:","o":["نفسه في موطنه الحقيقي","نفسه في موطنه المختار","لكل شخص يسكن معه","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"يجب أن يفصل بين يوم تسليم الاستدعاء للشاهد المقيم بدائرة نفوذ المحكمة وتاريخ الجلسة:","o":["خمسة أيام","عشرة أيام","خمسة عشر يوماً","جميع الأجوبة خاطئة"],"a":[0]},{"q":"يمكن تجريح الخبير الذي لم يعين باتفاق الأطراف:","o":["إذا عين لإنجاز خبرة في غير مجال تخصصه","إذا كان زوجه دائنا لأحد أطراف الدعوى","بطلب من الخبير نفسه","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"يعتبر من بين إجراءات التحقيق في الدعوى المدنية:","o":["الخبرة","اليمين","البحث التمهيدي","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تكون المسطرة شفوية أمام المحكمة الابتدائية في:","o":["قضايا الحالة المدنية","قضايا الإفراغ في عقود الكراء السكني","قضايا النفقة","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"يجوز تبليغ الاستدعاء قبل الساعة السابعة صباحا، بناء على إذن مكتوب من طرف:","o":["رئيس المحكمة","وكيل الملك","القاضي المقرر","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"تضم لجنة التنسيق على صعيد كل محكمة من الدرجة الأولى:","o":["الرئيس الأول لمحكمة الاستئناف","ممثل المصالح اللاممركزة لوزارة العدل","رئيس المحكمة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"تضم لجنة ب ,"a":[0],"explanation":"CASCADE يحذف السجلات التابعة تلقائياً عند حذف السجل الأب.\n\n**"},{"q":"بيانات الزبائن\nشركة تخزن اسم الزبون في جدول الطلبات، وفي كل مرة يقوم الزبون بطلب جديد يتم تكرار اسمه وعنوانه. ما المشكلة الأساسية في هذا التصميم؟","o":["مشكلة التكرار وعدم الاتساق","مشكلة AUTO_INCREMENT","مشكلة INDEX","مشكلة SELECT"],"a":[0],"explanation":"الأفضل فصل بيانات الزبائن في جدول مستقل وربط الطلبات به لتجنب تكرار المعلومات.\n\n**"},{"q":"نظام المخزون\nمتجر لديه جدول products يحتوي على id وname وprice وstock. تريد تخزين كل عملية دخول أو خروج للسلع مع تاريخ العملية وكميتها. ما التصميم الأفضل؟","o":["تغيير stock يدوياً فقط","إنشاء جدول stock_movements مرتبط بالمنتجات","إنشاء قاعدة بيانات لكل منتج","تخزين جميع العمليات داخل عمود واحد"],"a":[1],"explanation":"جدول الحركات يسمح بتتبع تاريخ المخزون ومعرفة عمليات الدخول والخروج.\n\n**"},{"q":"تخزين تاريخ الميلاد\nنظام تسجيل يريد تخزين تاريخ ميلاد الموظف فقط دون الساعة والدقائق. ما النوع الأنسب؟","o":["DATETIME","TIMESTAMP","DATE","TIME"],"a":[2],"explanation":"DATE يخزن السنة والشهر واليوم فقط.\n\n**"},{"q":"تصميم جدول الفواتير\nكل فاتورة تحتوي على عدة منتجات، والمنتج نفسه يمكن أن يظهر في فواتير مختلفة. كيف تصمم قاعدة البيانات؟","o":["وضع جميع المنتجات في عمود واحد داخل invoices","إنشاء جدول invoice_items يحتوي على invoice_id وproduct_id والكمية والسعر","إنشاء جدول لكل فاتورة","وضع invoice_id داخل جدول customers فقط"],"a":[1],"explanation":"جدول invoice_items يمثل العلاقة Many-to-Many ويخزن تفاصيل كل منتج داخل الفاتورة.\n\n**"},{"q":"منع القيم السالبة\nفي نظام المخزون، لا يجب أن تكون كمية المنتج أقل من صفر. ما الحل المناسب على مستوى قاعدة البيانات في MySQL 8.0.16 وما بعده؟","o":["CHECK (stock >= 0)","UNIQUE(stock)","INDEX(stock)","DEFAULT NULL"],"a":[0],"explanation":"CHECK يفرض شرطاً على القيم التي يتم إدخالها أو تحديثها.\n\n**"},{"q":"تغيير رقم الموظف\nشركة تستعمل رقم الموظف كـ Primary Key، وتريد أن تظل العلاقات المرتبطة به صحيحة إذا تغير الرقم. ما الخيار المناسب؟","o":["ON DELETE CASCADE","ON UPDATE CASCADE","ON DELETE SET NULL","TRUNCATE"],"a":[1],"explanation":"ON UPDATE CASCADE يحدث المفاتيح الأجنبية التابعة تلقائياً عند تغيير المفتاح الأساسي."},{"q":"البحث عن موظف\nلديك جدول employees وتريد عرض الموظفين الذين يتجاوز راتبهم 6000 درهم. أي استعلام صحيح؟","o":["`SELECT * FROM employees WHERE salary > 6000;`","`SELECT employees WHERE salary > 6000;`","`SHOW employees WHERE salary > 6000;`","`DELETE FROM employees WHERE salary > 6000;`"],"a":[0],"explanation":"SELECT لاسترجاع البيانات وWHERE لتطبيق شرط الراتب.\n\n**"},{"q":"البحث عن أسماء تبدأ بحرف A\nتريد استخراج جميع الزبائن الذين تبدأ أسماؤهم بالحرف A. ما الاستعلام الصحيح؟","o":["`SELECT * FROM customers WHERE name = 'A%';`","`SELECT * FROM customers WHERE name LIKE 'A%';`","`SELECT * FROM customers WHERE name LIKE '%A';`","`SELECT * FROM customers WHERE name IN 'A%';`"],"a":[1],"explanation":"A% تعني أن الاسم يبدأ بحرف A ويمكن أن يتبعه أي عدد من الأحرف.\n\n**"},{"q":"البحث عن المنتجات الغالية\nمتجر يريد عرض المنتجات التي يتراوح سعرها بين 100 و500 درهم، مع احتساب الحدين. ماذا تستعمل؟","o":["`BETWEEN 100 AND 500`","`LIKE 100 AND 500`","`IN 100 AND 500`","`LIMIT 100 AND 500`"],"a":[0],"explanation":"BETWEEN تشمل القيمتين 100 و500.\n\n**"},{"q":"عرض آخر 10 مستخدمين\nتريد عرض آخر 10 مستخدمين تمت إضافتهم، مع افتراض أن id يزداد تلقائياً. ما الاستعلام؟","o":["`SELECT * FROM users LIMIT 10;`","`SELECT * FROM users ORDER BY id DESC LIMIT 10;`","`SELECT * FROM users ORDER BY id ASC LIMIT 10;`","`SELECT LAST 10 FROM users;`"],"a":[1],"explanation":"DESC يعرض المعرفات الأكبر أولاً، وLIMIT يحدد العدد.\n\n**"},{"q":"اكتشاف البريد المكرر\nمسؤول قاعدة البيانات يريد معرفة عناوين البريد الإلكتروني المستعملة أكثر من مرة. ما الاستعلام الصحيح؟","o":["`SELECT email FROM users GROUP BY email HAVING COUNT(*) > 1;`","`SELECT email FROM users WHERE COUNT(*) > 1;`","`SELECT DISTINCT email FROM users;`","`DELETE FROM users WHERE email > 1;`"],"a":[0],"explanation":"GROUP BY يجمع السجلات حسب البريد، وHAVING يختار المجموعات التي تتكرر أكثر من مرة.\n\n**"},{"q":"حساب عدد الموظفين\nمدير يريد معرفة العدد الإجمالي للموظفين داخل جدول employees. ما الاستعلام الصحيح؟","o":["`SELECT SUM(*) FROM employees;`","`SELECT COUNT(*) FROM employees;`","`SELECT AVG(*) FROM employees;`","`SELECT MAX(*) FROM employees;`"],"a":[1],"explanation":"COUNT(\\*) يحسب عدد السجلات.\n\n**"},{"q":"حساب متوسط الرواتب\nتريد إدارة الموارد البشرية معرفة متوسط رواتب جميع الموظفين. ما الاستعلام الصحيح؟","o":["`SELECT SUM(salary) FROM employees;`","`SELECT COUNT(salary) FROM employees;`","`SELECT AVG(salary) FROM employees;`","`SELECT MAX(salary) FROM employees;`"],"a":[2],"explanation":"AVG يحسب المتوسط الحسابي للقيم غير NULL.\n\n**"},{"q":"أعلى راتب\nتريد استخراج أعلى راتب داخل الشركة. ما الاستعلام؟","o":["`SELECT MIN(salary) FROM employees;`","`SELECT MAX(salary) FROM employees;`","`SELECT AVG(salary) FROM employees;`","`SELECT COUNT(salary) FROM employees;`"],"a":[1],"explanation":"MAX ترجع أكبر قيمة.\n\n**"},{"q":"الموظفون بدون قسم\nتريد معرفة الموظفين الذين لم يتم تعيينهم لأي قسم، وقيمة department_id لديهم هي NULL. ما الاستعلام الصحيح؟","o":["`SELECT * FROM employees WHERE department_id = NULL;`","`SELECT * FROM employees WHERE department_id IS NULL;`","`SELECT * FROM employees WHERE department_id = 0;`","`SELECT * FROM employees WHERE department_id LIKE NULL;`"],"a":[1],"explanation":"يجب استعمال IS NULL وليس = NULL.\n\n**"},{"q":"عرض الأقسام التي تضم أكثر من 5 موظفين\nتريد معرفة الأقسام التي تضم أكثر من خمسة موظفين. أي استعلام مناسب؟","o":["`SELECT department_id FROM employees GROUP BY department_id HAVING COUNT(*) > 5;`","`SELECT department_id FROM employees WHERE COUNT(*) > 5;`","`SELECT department_id FROM employees ORDER BY COUNT(*) > 5;`","`SELECT department_id FROM employees LIMIT 5;`"],"a":[0],"explanation":"HAVING تستعمل لتصفية النتائج بعد التجميع.\n\n**"},{"q":"تحديث راتب موظف\nموظف رقمه 15 حصل على زيادة في الراتب من 5000 إلى 6000 درهم. ما الاستعلام المناسب؟","o":["`UPDATE employees SET salary = 6000 WHERE id = 15;`","`INSERT INTO employees SET salary = 6000;`","`DELETE FROM employees WHERE id = 15;`","`SELECT salary = 6000 FROM employees;`"],"a":[0],"explanation":"UPDATE يغير القيمة الموجودة، وWHERE يحدد الموظف المقصود.\n\n**"},{"q":"حذف طلب ملغى\nتريد حذف طلب واحد رقمه 25 من جدول orders دون حذف الطلبات الأخرى. ما الاستعلام الصحيح؟","o":["`DROP TABLE orders;`","`DELETE FROM orders WHERE id = 25;`","`TRUNCATE orders;`","`DELETE orders;`"],"a":[1],"explanation":"DELETE مع WHERE يحذف السجل المحدد فقط.\n\n**"},{"q":"عرض المنتجات بدون تكرار\nيوجد جدول orders يحتوي على category، وتريد معرفة جميع التصنيفات المختلفة الموجودة فيه. ماذا تستعمل؟","o":["GROUP","DISTINCT","UNIQUE","DELETE"],"a":[1],"explanation":"DISTINCT يعرض القيم المختلفة دون تكرار في نتيجة الاستعلام.\n\n**"},{"q":"البحث عن أسماء تحتوي على كلمة Ahmed\nتريد البحث عن جميع المستخدمين الذين تحتوي أسماؤهم على Ahmed في أي مكان. ما الاستعلام الصحيح؟","o":["`SELECT * FROM users WHERE name LIKE 'Ahmed%';`","`SELECT * FROM users WHERE name LIKE '%Ahmed%';`","`SELECT * FROM users WHERE name LIKE '%Ahmed';`","`SELECT * FROM users WHERE name = '%Ahmed%';`"],"a":[1],"explanation":"وجود % قبل الكلمة وبعدها يسمح بوجود أحرف قبلها وبعدها.\n\n**"},{"q":"استخراج الموظفين من قسمين\nتريد عرض الموظفين الذين ينتمون إلى القسم 2 أو القسم 4. ما الاستعلام الأفضل؟","o":["`SELECT * FROM employees WHERE department_id IN (2,4);`","`SELECT * FROM employees WHERE department_id BETWEEN 2 AND 4;`","`SELECT * FROM employees WHERE department_id LIKE (2,4);`","`SELECT * FROM employees WHERE department_id = 2 AND 4;`"],"a":[0],"explanation":"IN تبحث عن القيم الموجودة ضمن قائمة محددة.\n\n**"},{"q":"حساب المبيعات حسب كل شهر\nمتجر يريد معرفة مجموع المبيعات لكل شهر. جدول sales يحتوي على sale_date وamount. ما الاستعلام المناسب؟","o":["`SELECT MONTH(sale_date), SUM(amount) FROM sales GROUP BY MONTH(sale_date);`","`SELECT MONTH(sale_date), COUNT(amount) FROM sales;`","`SELECT SUM(amount) FROM sales WHERE MONTH(sale_date);`","`SELECT * FROM sales ORDER BY amount;`"],"a":[0],"explanation" cker les informations de ses clients et leurs commandes sans répéter les données personnelles dans chaque commande. Quel principe doit-elle appliquer ?","o":["La dénormalisation systématique","La normalisation","La duplication des tables","La suppression des clés étrangères"],"a":[1],"explanation":"التطبيع كينظم البيانات ويقلل التكرار ومشاكل التحديث والحذف والإضافة.\n\nQuestions 26 à 50 – SQL avancé et manipulation des données"},{"q":"Une table employees contient salary. Le responsable RH souhaite afficher les employés dont le salaire est supérieur à 8 000 DH. Quelle requête est correcte ?","o":["SELECT * FROM employees WHERE salary > 8000;","SELECT employees WHERE salary > 8000;","GET * FROM employees salary > 8000;","SELECT * FROM employees HAVING salary > 8000;"],"a":[0],"explanation":"WHERE كتفلتر السجلات حسب الشرط قبل التجميع."},{"q":"Une entreprise veut afficher les employés dont le salaire est compris entre 5 000 et 10 000 DH, bornes incluses. Quelle condition est correcte ?","o":["salary > 5000 AND salary < 10000","salary BETWEEN 5000 AND 10000","salary IN (5000,10000)","salary = BETWEEN 5000 AND 10000"],"a":[1],"explanation":"BETWEEN كيشمل الحد الأدنى والحد الأقصى."},{"q":"Un service veut rechercher tous les clients dont le nom commence par « Mo ». Quelle condition convient ?","o":["name LIKE '%Mo'","name LIKE 'Mo%'","name = 'Mo%'","name LIKE '_Mo'"],"a":[1],"explanation":"% كتعني أي عدد من الأحرف من بعد Mo، وبالتالي كنلقاو الأسماء اللي كتبدأ بهاد الحروف."},{"q":"Une application doit afficher les employés dont l'adresse électronique n'est pas renseignée. Quelle condition est correcte ?","o":["email = NULL","email == NULL","email IS NULL","email NOT EXISTS"],"a":[2],"explanation":"فـ SQL، المقارنة مع NULL كتكون باستعمال IS NULL، ماشي = NULL."},{"q":"Un responsable souhaite afficher les salaires du plus élevé au plus faible. Quelle clause faut-il utiliser ?","o":["GROUP BY salary DESC","ORDER BY salary DESC","SORT salary DESC","WHERE salary DESC"],"a":[1],"explanation":"ORDER BY كتقوم بالترتيب، وDESC كتعني التنازلي."},{"q":"Une entreprise souhaite connaître le nombre total d'employés enregistrés dans la table employees. Quelle requête est correcte ?","o":["SELECT SUM(*) FROM employees;","SELECT COUNT(*) FROM employees;","SELECT TOTAL(id) FROM employees;","SELECT NUMBER(*) FROM employees;"],"a":[1],"explanation":"COUNT(*) كتحسب جميع السجلات، حتى إلا كانت بعض الأعمدة فيها NULL."},{"q":"Le directeur veut connaître le salaire moyen des employés. Quelle fonction doit-il utiliser ?","o":["SUM()","COUNT()","AVG()","MAX()"],"a":[2],"explanation":"AVG() كتحسب المتوسط الحسابي للقيم الرقمية."},{"q":"Une entreprise veut afficher le salaire maximum de chaque département. Quelle requête est la plus adaptée ?","o":["SELECT department_id, MAX(salary) FROM employees GROUP BY department_id;","SELECT MAX(salary) FROM employees;","SELECT department_id, salary FROM employees ORDER BY salary;","SELECT department_id FROM employees HAVING MAX(salary);"],"a":[0],"explanation":"GROUP BY كتجمع الموظفين حسب القسم، وMAX() كتجيب أكبر راتب داخل كل مجموعة."},{"q":"Un responsable veut afficher uniquement les départements dont le salaire moyen dépasse 9 000 DH. Quelle clause permet de filtrer les groupes après agrégation ?","o":["WHERE","ORDER BY","HAVING","LIMIT"],"a":[2],"explanation":"HAVING كتفلتر المجموعات بعد تطبيق دوال التجميع بحال AVG()."},{"q":"Une table employees contient plusieurs employés ayant le même nom. Le responsable souhaite afficher chaque nom une seule fois. Quelle instruction convient ?","o":["SELECT UNIQUE name FROM employees;","SELECT DISTINCT name FROM employees;","SELECT SINGLE name FROM employees;","SELECT name GROUP BY ALL employees;"],"a":[1],"explanation":"DISTINCT كتحيد القيم المكررة من النتائج."},{"q":"Une entreprise veut afficher les 10 produits les plus chers. Quelle requête est correcte ?","o":["SELECT * FROM products LIMIT 10 ORDER BY price DESC;","SELECT * FROM products ORDER BY price DESC LIMIT 10;","SELECT TOP 10 * FROM products;","SELECT * FROM products WHERE price DESC LIMIT 10;"],"a":[1],"explanation":"كنرتبو المنتجات تنازلياً حسب الثمن، ومن بعد كنختارو أول 10 نتائج."},{"q":"Un responsable souhaite augmenter de 10 % le salaire des employés du département 3. Quelle requête est correcte ?","o":["UPDATE employees SET salary = salary * 1.10 WHERE department_id = 3;","UPDATE employees salary = salary + 10%;","ALTER employees SET salary = 10;","INSERT INTO employees SET salary = salary * 1.10;"],"a":[0],"explanation":"UPDATE كتعدل السجلات، وWHERE كتحدد غير الموظفين ديال القسم 3."},{"q":"Un administrateur souhaite supprimer les commandes annulées avant le 1er janvier 2025. Quelle instruction est correcte ?","o":["DELETE FROM orders WHERE status='cancelled' AND order_date < '2025-01-01';","DROP TABLE orders WHERE status='cancelled';","REMOVE orders WHERE order_date < '2025-01-01';","TRUNCATE orders WHERE status='cancelled';"],"a":[0],"explanation":"DELETE كتسمح بحذف سجلات محددة باستعمال WHERE. أما TRUNCATE كتحذف جميع السجلات."},{"q":"Une entreprise veut ajouter une colonne birth_date à une table employees déjà existante. Quelle instruction faut-il utiliser ?","o":["UPDATE TABLE employees ADD birth_date DATE;","ALTER TABLE employees ADD birth_date DATE;","INSERT COLUMN birth_date INTO employees;","CREATE COLUMN birth_date IN employees;"],"a":[1],"explanation":"ALTER TABLE كتسمح بتغيير بنية الجدول، ومن بينها إضافة الأعمدة."},{"q":"Un administrateur souhaite supprimer définitivement la structure et les données d'une table temporary_logs. Quelle instruction convient ?","o":["DELETE DATABASE temporary_logs;","DROP TABLE temporary_logs;","REMOVE TABLE temporary_logs;","TRUNCATE DATABASE temporary_logs;"],"a":[1],"explanation":"DROP TABLE كتحذف الجدول نفسه مع البيانات والبنية ديالو."},{"q":"Une application doit remplacer les valeurs NULL de la colonne phone par « Non renseigné » dans les résultats affichés. Quelle fonction peut être utilisée ?","o":["IFNULL(phone, 'Non renseigné')","COUNT(phone)","SUM(phone)","DELETE(phone)"],"a":[0],"explanation":"IFNULL() كتبدل NULL بقيمة أخرى غير NULL فنتيجة الاستعلام."},{"q":"Une entreprise veut concaténer le prénom et le nom d'un employé dans une seule colonne de résultat. Quelle fonction MySQL convient ?","o":["JOIN_TEXT()","CONCAT()","MERGE()","COMBINE()"],"a":[1],"explanation":"CONCAT() كتجمع النصوص فنتيجة واحدة."},{"q":"Un service souhaite extraire uniquement l'année d'une date de commande. Quelle fonction est correcte ?","o":["YEAR(order_date)","DATE_YEAR(order_date)","GETYEAR(order_date)","EXTRACT_YEAR(order_date)"],"a":[0],"explanation":"YEAR() كتستخرج السنة من قيمة التاريخ."},{"q":"Une entreprise souhaite afficher les commandes passées pendant l'année 2025. Quelle condition est généralement préférable pour une colonne DATETIME indexée ?","o":["YEAR(order_date) = 2025","order_date BETWEEN '2025-01-01' AND '2025-12-31' sans préciser l'heure de fin","order_date >= '2025-01-01' AND order_date < '2026-01-01'","order_date = 2025"],"a":[2],"explanation":"هاد الشرط كيشمل السنة كاملة حتى آخر لحظة من 31 دجنبر، وكيكون غالباً مناسب أكثر لاستعمال الفهرس من تطبيق دالة على العمود."},{"q":"Un développeur veut récupérer les employés dont le salaire est supérieur au salaire moyen de tous les employés. Quelle solution convient ?","o":["Une sous-requête utilisant AVG(salary)","Une instruction INSERT","Une instruction DROP","Une clause LIMIT"],"a":[0],"explanation":"كنحسبو المتوسط باستعلام فرعي، ومن بعد كنقارنو به راتب كل موظف."},{"q":"Une entreprise souhaite retrouver les clients qui n'ont jamais passé de commande. Quelle solution SQL est particulièrement adaptée ?","o":["INNER JOIN uniquement","LEFT JOIN suivi de WHERE orders.id IS NULL","CROSS JOIN","RIGHT JOIN sans condition"],"a":[1],"explanation":"LEFT JOIN كيبقي جميع العملاء، واللي ماعندهمش طلبات كيبان عندهم معرف الطلب NULL."},{"q":"Un responsable souhaite rechercher les produits dont le prix est égal à l'un des prix suivants : 100, 200 ou 300 DH. Quelle condition convient ?","o":["price BETWEEN (100,200,300)","price IN (100,200,300)","price LIKE (100,200,300)","price IS (100,200,300)"],"a":[1],"explanation":"IN كتختبر واش القيمة كاينة ضمن لائحة ديال القيم المحددة."},{"q":"Une table employees contient des milliers de lignes. Le responsable souhaite rechercher les employés dont le nom contient « Ahmed ». Quelle condition est correcte ?","o":["name LIKE 'Ahmed%'","name LIKE '%Ahmed%'","name = '%Ahmed%'","name IN ('Ahmed')"],"a":[1],"explanation":"%Ahmed% كتبحث على Ahmed فأي مكان داخل النص."},{"q":"Un système doit calculer le montant total de chaque commande à partir de quantity et unit_price dans order_details. Quelle expression convient ?","o":["SUM(quantity * unit_price)","COUNT(quantity + unit_price)","MAX(quantity * unit_price)","AVG(quantity + unit_price)"],"a":[0],"explanation":"كنضربو الكمية فثمن الوحدة لكل سطر، وSUM() كتجمع المبالغ ديال جميع الأسطر."},{"q":"Un administrateur veut supprimer les doublons d'une requête sans modifier les données de la table. Quelle solution utilise-t-il ?","o":["DELETE DUPLICATES","SELECT DISTINCT","DROP DUPLICATES","TRUNCATE DISTINCT"],"a":[1],"explanation":"DISTINCT كتزيل التكرار من النتائج فقط، وماكتبدلش البيانات الأصلية فالجدول.\n\nQuestions 51 à 75 – Jointures et sous-requêtes"},{"q":"Une entreprise possède deux tables : employees et departments. Elle souhaite afficher uniquement les employés ayant un département correspondant. Quelle jointure faut-il utiliser ?","o":["LEFT JOIN","INNER JOIN","CROSS JOIN","FULL OUTER JOIN"],"a":[1],"explanation":"INNER JOIN كترجع غير السجلات اللي عندها تطابق بين الجدولين."},{"q":"Le responsable veut afficher tous les départements, même ceux qui ne possèdent aucun employé. Quelle jointure convient si departments est la table principale ?","o":["INNER JOIN","LEFT JOIN","CROSS JOIN","SELF JOIN"],"a":[1],"explanation":"LEFT JOIN كترجع جميع الأقسام، وحتى القسم اللي ماعندوش موظفين كيبان، مع NULL فمعلومات الموظف."},{"q":"Une entreprise souhaite afficher toutes les commandes et les informations du client correspondant. Certaines commandes peuvent ne pas avoir de client associé. Quelle jointure est adaptée ?","o":["INNER JOIN","LEFT JOIN à partir de orders","CROSS JOIN","SELF JOIN"],"a":[1],"explanation":"كنخليو الطلبات هي الجدول الأيسر باش تبان كاملة، حتى إلا ماكانش العميل المرتبط بها."},{"q":"Une entreprise veut afficher les employés et le nom de leur responsable, sachant que les deux informations se trouvent dans la même table. Quelle technique utiliser ?","o":["CROSS JOIN","SELF JOIN","UNION","FULL JOIN"],"a":[1],"explanation":"SELF JOIN كتربط الجدول براسو، مثلاً employees.manager_id مع employees.id."},{"q":"Une application doit afficher toutes les combinaisons possibles entre les tailles disponibles et les couleurs disponibles d'un produit. Quelle jointure convient ?","o":["INNER JOIN","LEFT JOIN","CROSS JOIN","SELF JOIN"],"a":[2],"explanation":"CROSS JOIN كتنشئ جميع التركيبات الممكنة بين صفوف الجدولين."},{"q":"Une entreprise souhaite récupérer les employés dont le salaire est supérieur à celui de chaque employé du département 2. Quelle opération logique est adaptée ?","o":["> ALL (sous-requête)","= ANY (sous-requête)","IN (sous-requête) uniquement","LIKE (sous-requête)"],"a":[0],"explanation":"ALL كتعني أن الشرط خاصو يكون صحيح مع جميع القيم اللي رجعها الاستعلام الفرعي."},{"q":"Un responsable veut trouver les employés dont le salaire est supérieur à au moins un salaire du département 2. Quelle expression convient ?","o":["> ALL","> ANY","IS NULL","NOT IN"],"a":[1],"explanation":"ANY كتطلب أن الشرط يكون صحيح مع قيمة واحدة على الأقل من النتائج."},{"q":"Une entreprise souhaite vérifier l'existence d'au moins une commande pour chaque client. Quelle fonction logique peut être utilisée ?","o":["EXISTS","DISTINCT","UNION","REPLACE"],"a":[0],"explanation":"EXISTS كترجع TRUE إلا كان الاستعلام الفرعي رجع على الأقل سطر واحد."},{"q":"Un développeur souhaite récupérer les clients qui n'ont aucune commande. Quelle solution est souvent plus sûre que NOT IN lorsque des valeurs NULL peuvent exister ?","o":["NOT EXISTS","COUNT(*) = 0 sans corrélation","INNER JOIN","UNION ALL"],"a":[0],"explanation":"NOT EXISTS كتتفادى بعض المشاكل المنطقية اللي ممكن يسببها NULL داخل نتائج NOT IN."},{"q":"Une entreprise souhaite afficher les noms des clients et les noms des produits achetés. Les données sont réparties dans trois tables : customers, orders et order_details. Combien de relations faut-il généralement établir ?","o":["Une seule","Deux","Trois","Aucune"],"a":[1],"explanation":"كنربطو customers مع orders، ومن بعد orders مع order_details. وإذا بغينا أسماء المنتجات نزيدو جدول products، يعني فهاد الحالة بالضبط خاصنا ثلاث علاقات."},{"q":"Une requête utilise INNER JOIN entre customers et orders. Un client sans commande n'apparaît pas dans le résultat. Pourquoi ?","o":["INNER JOIN exclut les lignes sans correspondance","MySQL supprime automatiquement le client","La clé primaire est incorrecte","ORDER BY masque le client"],"a":[0],"explanation":"INNER JOIN ماكترجعش السجل إلا ماكانش تطابق فالجدول الآخر."},{"q":"Une entreprise souhaite afficher les clients qui ont passé au moins trois commandes. Quelle structure de requête est correcte ?","o":["GROUP BY customer_id HAVING COUNT(*) >= 3","WHERE COUNT(*) >= 3","ORDER BY COUNT(*) >= 3","LIMIT COUNT(*) >= 3"],"a":[0],"explanation":"كنجمّعو الطلبات حسب العميل، ومن بعد HAVING كتحتافظ بالعملاء اللي عندهم ثلاثة طلبات أو أكثر."},{"q":"Un développeur utilise une sous-requête qui retourne plusieurs lignes, mais il compare son résultat avec =. Quelle erreur peut survenir ?","o":["Unknown database","Subquery returns more than 1 row","Duplicate column","Table is read-only"],"a":[1],"explanation":"العامل = كيتوقع قيمة واحدة، ولكن الاستعلام الفرعي رجع عدة أسطر. يمكن استعمال IN أو ANY حسب الحالة."},{"q":"Une entreprise souhaite afficher les produits dont le prix est supérieur au prix moyen de leur propre catégorie. Quelle approche est la plus adaptée ?","o":["Sous-requête corrélée","CROSS JOIN sans condition","DELETE avec GROUP BY","TRUNCATE avec HAVING"],"a":[0],"explanation":"الاستعلام الفرعي المرتبط كيعتمد على الفئة ديال المنتج الحالي باش يحسب متوسط نفس الفئة."},{"q":"Une requête doit combiner les résultats de deux tables ayant les mêmes colonnes, tout en éliminant les doublons. Quelle instruction convient ?","o":["UNION","UNION ALL","CROSS JOIN","INNER JOIN"],"a":[0],"explanation":"UNION كتجمع النتائج وكتحيد التكرار. أما UNION ALL كتحتافظ به."},{"q":"Une entreprise souhaite combiner deux listes de clients sans supprimer les doublons pour accélérer la requête. Quelle instruction choisir ?","o":["UNION","UNION ALL","DISTINCT","GROUP BY"],"a":[1],"explanation":"UNION ALL ماكتقومش بعملية إزالة التكرار، وغالباً كتكون أقل تكلفة من UNION."},{"q":"Une requête utilise LEFT JOIN, mais la condition sur la table droite est placée dans WHERE : WHERE orders.status = 'paid'. Quel effet peut se produire ?","o":["Les clients sans commande peuvent être éliminés","Tous les clients sont conservés obligatoirement","Les commandes sont automatiquement supprimées","La jointure devient un CROSS JOIN"],"a":[0],"explanation":"الشرط فـ WHERE كيرفض NULL ديال الجدول الأيمن، وكيقدر يخلي النتيجة بحال INNER JOIN. وضع الشرط فـ ON يقدر يحافظ على جميع العملاء."},{"q":"Une table employees contient plusieurs employés par département. Le responsable veut afficher chaque département avec le nombre d'employés, y compris les départements vides. Quelle requête est la plus adaptée ?","o":["departments LEFT JOIN employees avec COUNT(employees.id)","employees INNER JOIN departments avec COUNT(*)","employees CROSS JOIN departments","employees RIGHT JOIN employees"],"a":[0],"explanation":"كنبدأو من الأقسام ونديرو LEFT JOIN، ونستعملو COUNT(employees.id) باش القسم الفارغ يعطي 0 ماشي 1."},{"q":"Une entreprise veut récupérer le dernier paiement effectué par chaque client. Quelle méthode est adaptée à MySQL 8 ?","o":["Utiliser ROW_NUMBER() avec PARTITION BY customer_id","Utiliser TRUNCATE(   $('#cnt').textContent='السؤال '+(S.i+1)+' من '+n;

$('#prev').onclick=()=>{S.i--;render();scrollTo(0,0)};
