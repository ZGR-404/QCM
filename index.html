<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار QCM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--pr:#2f5fd0;--prt:#fff;--ok:#1e9e4f;--okb:#e1f5e9;--bad:#d1342f;--badb:#fbe5e4;--sel:#e6edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 "Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 14px;line-height:1.6}
p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
label.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
label.row small{display:block;color:var(--mu);font-size:14px}
input{accent-color:var(--pr);width:20px;height:20px;margin-top:5px;flex:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:11px 22px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:15px;margin-bottom:8px}
.track{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
#bar{height:100%;width:0;background:var(--pr);transition:width .3s}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.sel{background:var(--sel);border-color:var(--pr)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{background:var(--badb);border-color:var(--bad)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--tx)}
.feedback{margin-top:14px;padding:13px 15px;border-radius:10px;background:var(--okb);border:1px solid var(--ok);white-space:pre-wrap}.feedback strong{display:block;margin-bottom:5px}.feedback.wrong{background:var(--badb);border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:14px 0}
.stats div{background:var(--bg);border-radius:12px;padding:12px 4px}
.stats strong{display:block;font-size:26px}.g{color:var(--ok)}.r{color:var(--bad)}
.big{font-size:44px;font-weight:700;text-align:center;margin:0}
.rev{border-inline-start:5px solid var(--bd)}.rev.ok{border-color:var(--ok)}.rev.bad{border-color:var(--bad)}
h2#qt,.rev h3{white-space:pre-line}
.rev h3{font-size:17px;margin:0 0 10px}
.rev .opt{padding:8px 12px;margin-bottom:6px;font-size:16px}
.tag{font-size:13px;margin-inline-start:auto;flex:none;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>اختبار QCM</h1>
  <p class="sub" id="total"></p>
  <div class="card">
    <h2>نوع الاختبار</h2>
    <label class="row"><input type="radio" name="deck" value="clerk" checked><span>محرر قضائي<small>80 سؤالاً، يمكن اختيار أكثر من جواب.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="police"><span>ضابط شرطة<small>50 سؤالاً، جواب واحد لكل سؤال.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="sn"><span>نموذج عام: مباراة الأمن الوطني<small>200 سؤال، جواب واحد لكل سؤال، ثقافة عامة وقانون.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="db"><span>Data Base<small>200 سؤالاً بالفرنسية حول MySQL، جواب واحد لكل سؤال.</small></span></label>
  </div>
  <div class="card">
    <h2>طريقة الاختبار</h2>
    <label class="row"><input type="radio" name="mode" value="practice" checked><span>وضع التدريب<small>يظهر اللون الأخضر أو الأحمر فور اختيارك للجواب، مع إظهار الجواب الصحيح.</small></span></label>
    <label class="row"><input type="radio" name="mode" value="exam"><span>وضع الامتحان<small>لا يظهر أي تصحيح أثناء الاختبار، ويُعرض كل شيء في النهاية.</small></span></label>
  </div>
  <div class="card">
    <h2>الخلط</h2>
    <label class="row"><input type="checkbox" id="sq" checked><span>خلط ترتيب الأسئلة</span></label>
    <label class="row"><input type="checkbox" id="so" checked><span>خلط ترتيب الاختيارات</span></label>
  </div>
  <button class="btn" id="go" style="width:100%;font-size:18px">ابدأ الاختبار</button>
</section>

<section id="quiz" hidden>
  <div class="meta"><span id="cnt"></span><span id="md"></span></div>
  <div class="track"><div id="bar"></div></div>
  <p class="sub" id="hint" style="margin:0 0 10px" hidden>يمكن اختيار أكثر من جواب، ثم اضغط «تأكيد الجواب» في وضع التدريب.</p>
  <div class="card"><h2 id="qt"></h2><div id="opts"></div><div id="feedback" class="feedback" hidden></div></div>
  <div class="nav"><button class="btn ghost" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
</section>

<section id="result" hidden>
  <div class="card">
    <p class="big" id="pct"></p>
    <p style="text-align:center;margin:0;color:var(--mu)" id="msg"></p>
    <div class="stats">
      <div><strong id="sc"></strong>النتيجة</div>
      <div><strong class="g" id="cn"></strong>صحيحة</div>
      <div><strong class="r" id="wn"></strong>خاطئة</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="retry">إعادة الاختبار</button><button class="btn ghost" id="settings">تغيير الإعدادات</button></div>
  </div>
  <h2>التصحيح</h2>
  <label class="row" style="padding-top:0"><input type="checkbox" id="onlyw"><span>إظهار الأسئلة الخاطئة فقط</span></label>
  <div id="rev"></div>
</section>
</main>
<script>
const DB={"clerk":{"name":"محرر قضائي","multi":true,"fix":true,"q":[{"q":"يثار الدفع بعدم الاختصاص المكاني في طور الاستئناف:","o":["بالنسبة للأحكام الحضورية","بالنسبة للأحكام النهائية","بالنسبة للأحكام الغيابية","جميع الأجوبة خاطئة"],"a":[2]},{"q":"يجب أن تبلغ إلى النيابة العامة بمجرد تقييدها الدعاوى:","o":["المتعلقة بمخاصمة القضاة","المتعلقة بعدم الاختصاص النوعي","المتعلقة بتنازع القوانين","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تتضمن الأحكام القضائية وجوبا البيانات التالية:","o":["باسم جلالة الملك وطبقا للقانون","المحكمة المصدرة للحكم","اسم كاتب الضبط","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"الدفع بعدم الاختصاص المكاني أمام المحكمة الابتدائية:","o":["يمكن إثارته تلقائيا من طرف المحكمة المختصة","يشترط أن يثار قبل كل دفع أو دفاع في الجوهر","يشترط بيان المحكمة المختصة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"يسلم الاستدعاء مرفقا بنسخة من مقال الدعوى إلى الشخص:","o":["نفسه في موطنه الحقيقي","نفسه في موطنه المختار","لكل شخص يسكن معه","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"يجب أن يفصل بين يوم تسليم الاستدعاء للشاهد المقيم بدائرة نفوذ المحكمة وتاريخ الجلسة:","o":["خمسة أيام","عشرة أيام","خمسة عشر يوماً","جميع الأجوبة خاطئة"],"a":[0]},{"q":"يمكن تجريح الخبير الذي لم يعين باتفاق الأطراف:","o":["إذا عين لإنجاز خبرة في غير مجال تخصصه","إذا كان زوجه دائنا لأحد أطراف الدعوى","بطلب من الخبير نفسه","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"يعتبر من بين إجراءات التحقيق في الدعوى المدنية:","o":["الخبرة","اليمين","البحث التمهيدي","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تكون المسطرة شفوية أمام المحكمة الابتدائية في:","o":["قضايا الحالة المدنية","قضايا الإفراغ في عقود الكراء السكني","قضايا النفقة","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"يجوز تبليغ الاستدعاء قبل الساعة السابعة صباحا، بناء على إذن مكتوب من طرف:","o":["رئيس المحكمة","وكيل الملك","القاضي المقرر","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"تضم لجنة التنسيق على صعيد كل محكمة من الدرجة الأولى:","o":["الرئيس الأول لمحكمة الاستئناف","ممثل المصالح اللاممركزة لوزارة العدل","رئيس المحكمة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"تضم لجنة ب ,"a":[0],"explanation":"CASCADE يحذف السجلات التابعة تلقائياً عند حذف السجل الأب.\n\n**"},{"q":"بيانات الزبائن\nشركة تخزن اسم الزبون في جدول الطلبات، وفي كل مرة يقوم الزبون بطلب جديد يتم تكرار اسمه وعنوانه. ما المشكلة الأساسية في هذا التصميم؟","o":["مشكلة التكرار وعدم الاتساق","مشكلة AUTO_INCREMENT","مشكلة INDEX","مشكلة SELECT"],"a":[0],"explanation":"الأفضل فصل بيانات الزبائن في جدول مستقل وربط الطلبات به لتجنب تكرار المعلومات.\n\n**"},{"q":"نظام المخزون\nمتجر لديه جدول products يحتوي على id وname وprice وstock. تريد تخزين كل عملية دخول أو خروج للسلع مع تاريخ العملية وكميتها. ما التصميم الأفضل؟","o":["تغيير stock يدوياً فقط","إنشاء جدول stock_movements مرتبط بالمنتجات","إنشاء قاعدة بيانات لكل منتج","تخزين جميع العمليات داخل عمود واحد"],"a":[1],"explanation":"جدول الحركات يسمح بتتبع تاريخ المخزون ومعرفة عمليات الدخول والخروج.\n\n**"},{"q":"تخزين تاريخ الميلاد\nنظام تسجيل يريد تخزين تاريخ ميلاد الموظف فقط دون الساعة والدقائق. ما النوع الأنسب؟","o":["DATETIME","TIMESTAMP","DATE","TIME"],"a":[2],"explanation":"DATE يخزن السنة والشهر واليوم فقط.\n\n**"},{"q":"تصميم جدول الفواتير\nكل فاتورة تحتوي على عدة منتجات، والمنتج نفسه يمكن أن يظهر في فواتير مختلفة. كيف تصمم قاعدة البيانات؟","o":["وضع جميع المنتجات في عمود واحد داخل invoices","إنشاء جدول invoice_items يحتوي على invoice_id وproduct_id والكمية والسعر","إنشاء جدول لكل فاتورة","وضع invoice_id داخل جدول customers فقط"],"a":[1],"explanation":"جدول invoice_items يمثل العلاقة Many-to-Many ويخزن تفاصيل كل منتج داخل الفاتورة.\n\n**"},{"q":"منع القيم السالبة\nفي نظام المخزون، لا يجب أن تكون كمية المنتج أقل من صفر. ما الحل المناسب على مستوى قاعدة البيانات في MySQL 8.0.16 وما بعده؟","o":["CHECK (stock >= 0)","UNIQUE(stock)","INDEX(stock)","DEFAULT NULL"],"a":[0],"explanation":"CHECK يفرض شرطاً على القيم التي يتم إدخالها أو تحديثها.\n\n**"},{"q":"تغيير رقم الموظف\nشركة تستعمل رقم الموظف كـ Primary Key، وتريد أن تظل العلاقات المرتبطة به صحيحة إذا تغير الرقم. ما الخيار المناسب؟","o":["ON DELETE CASCADE","ON UPDATE CASCADE","ON DELETE SET NULL","TRUNCATE"],"a":[1],"explanation":"ON UPDATE CASCADE يحدث المفاتيح الأجنبية التابعة تلقائياً عند تغيير المفتاح الأساسي."},{"q":"البحث عن موظف\nلديك جدول employees وتريد عرض الموظفين الذين يتجاوز راتبهم 6000 درهم. أي استعلام صحيح؟","o":["`SELECT * FROM employees WHERE salary > 6000;`","`SELECT employees WHERE salary > 6000;`","`SHOW employees WHERE salary > 6000;`","`DELETE FROM employees WHERE salary > 6000;`"],"a":[0],"explanation":"SELECT لاسترجاع البيانات وWHERE لتطبيق شرط الراتب.\n\n**"},{"q":"البحث عن أسماء تبدأ بحرف A\nتريد استخراج جميع الزبائن الذين تبدأ أسماؤهم بالحرف A. ما الاستعلام الصحيح؟","o":["`SELECT * FROM customers WHERE name = 'A%';`","`SELECT * FROM customers WHERE name LIKE 'A%';`","`SELECT * FROM customers WHERE name LIKE '%A';`","`SELECT * FROM customers WHERE name IN 'A%';`"],"a":[1],"explanation":"A% تعني أن الاسم يبدأ بحرف A ويمكن أن يتبعه أي عدد من الأحرف.\n\n**"},{"q":"البحث عن المنتجات الغالية\nمتجر يريد عرض المنتجات التي يتراوح سعرها بين 100 و500 درهم، مع احتساب الحدين. ماذا تستعمل؟","o":["`BETWEEN 100 AND 500`","`LIKE 100 AND 500`","`IN 100 AND 500`","`LIMIT 100 AND 500`"],"a":[0],"explanation":"BETWEEN تشمل القيمتين 100 و500.\n\n**"},{"q":"عرض آخر 10 مستخدمين\nتريد عرض آخر 10 مستخدمين تمت إضافتهم، مع افتراض أن id يزداد تلقائياً. ما الاستعلام؟","o":["`SELECT * FROM users LIMIT 10;`","`SELECT * FROM users ORDER BY id DESC LIMIT 10;`","`SELECT * FROM users ORDER BY id ASC LIMIT 10;`","`SELECT LAST 10 FROM users;`"],"a":[1],"explanation":"DESC يعرض المعرفات الأكبر أولاً، وLIMIT يحدد العدد.\n\n**"},{"q":"اكتشاف البريد المكرر\nمسؤول قاعدة البيانات يريد معرفة عناوين البريد الإلكتروني المستعملة أكثر من مرة. ما الاستعلام الصحيح؟","o":["`SELECT email FROM users GROUP BY email HAVING COUNT(*) > 1;`","`SELECT email FROM users WHERE COUNT(*) > 1;`","`SELECT DISTINCT email FROM users;`","`DELETE FROM users WHERE email > 1;`"],"a":[0],"explanation":"GROUP BY يجمع السجلات حسب البريد، وHAVING يختار المجموعات التي تتكرر أكثر من مرة.\n\n**"},{"q":"حساب عدد الموظفين\nمدير يريد معرفة العدد الإجمالي للموظفين داخل جدول employees. ما الاستعلام الصحيح؟","o":["`SELECT SUM(*) FROM employees;`","`SELECT COUNT(*) FROM employees;`","`SELECT AVG(*) FROM employees;`","`SELECT MAX(*) FROM employees;`"],"a":[1],"explanation":"COUNT(\\*) يحسب عدد السجلات.\n\n**"},{"q":"حساب متوسط الرواتب\nتريد إدارة الموارد البشرية معرفة متوسط رواتب جميع الموظفين. ما الاستعلام الصحيح؟","o":["`SELECT SUM(salary) FROM employees;`","`SELECT COUNT(salary) FROM employees;`","`SELECT AVG(salary) FROM employees;`","`SELECT MAX(salary) FROM employees;`"],"a":[2],"explanation":"AVG يحسب المتوسط الحسابي للقيم غير NULL.\n\n**"},{"q":"أعلى راتب\nتريد استخراج أعلى راتب داخل الشركة. ما الاستعلام؟","o":["`SELECT MIN(salary) FROM employees;`","`SELECT MAX(salary) FROM employees;`","`SELECT AVG(salary) FROM employees;`","`SELECT COUNT(salary) FROM employees;`"],"a":[1],"explanation":"MAX ترجع أكبر قيمة.\n\n**"},{"q":"الموظفون بدون قسم\nتريد معرفة الموظفين الذين لم يتم تعيينهم لأي قسم، وقيمة department_id لديهم هي NULL. ما الاستعلام الصحيح؟","o":["`SELECT * FROM employees WHERE department_id = NULL;`","`SELECT * FROM employees WHERE department_id IS NULL;`","`SELECT * FROM employees WHERE department_id = 0;`","`SELECT * FROM employees WHERE department_id LIKE NULL;`"],"a":[1],"explanation":"يجب استعمال IS NULL وليس = NULL.\n\n**"},{"q":"عرض الأقسام التي تضم أكثر من 5 موظفين\nتريد معرفة الأقسام التي تضم أكثر من خمسة موظفين. أي استعلام مناسب؟","o":["`SELECT department_id FROM employees GROUP BY department_id HAVING COUNT(*) > 5;`","`SELECT department_id FROM employees WHERE COUNT(*) > 5;`","`SELECT department_id FROM employees ORDER BY COUNT(*) > 5;`","`SELECT department_id FROM employees LIMIT 5;`"],"a":[0],"explanation":"HAVING تستعمل لتصفية النتائج بعد التجميع.\n\n**"},{"q":"تحديث راتب موظف\nموظف رقمه 15 حصل على زيادة في الراتب من 5000 إلى 6000 درهم. ما الاستعلام المناسب؟","o":["`UPDATE employees SET salary = 6000 WHERE id = 15;`","`INSERT INTO employees SET salary = 6000;`","`DELETE FROM employees WHERE id = 15;`","`SELECT salary = 6000 FROM employees;`"],"a":[0],"explanation":"UPDATE يغير القيمة الموجودة، وWHERE يحدد الموظف المقصود.\n\n**"},{"q":"حذف طلب ملغى\nتريد حذف طلب واحد رقمه 25 من جدول orders دون حذف الطلبات الأخرى. ما الاستعلام الصحيح؟","o":["`DROP TABLE orders;`","`DELETE FROM orders WHERE id = 25;`","`TRUNCATE orders;`","`DELETE orders;`"],"a":[1],"explanation":"DELETE مع WHERE يحذف السجل المحدد فقط.\n\n**"},{"q":"عرض المنتجات بدون تكرار\nيوجد جدول orders يحتوي على category، وتريد معرفة جميع التصنيفات المختلفة الموجودة فيه. ماذا تستعمل؟","o":["GROUP","DISTINCT","UNIQUE","DELETE"],"a":[1],"explanation":"DISTINCT يعرض القيم المختلفة دون تكرار في نتيجة الاستعلام.\n\n**"},{"q":"البحث عن أسماء تحتوي على كلمة Ahmed\nتريد البحث عن جميع المستخدمين الذين تحتوي أسماؤهم على Ahmed في أي مكان. ما الاستعلام الصحيح؟","o":["`SELECT * FROM users WHERE name LIKE 'Ahmed%';`","`SELECT * FROM users WHERE name LIKE '%Ahmed%';`","`SELECT * FROM users WHERE name LIKE '%Ahmed';`","`SELECT * FROM users WHERE name = '%Ahmed%';`"],"a":[1],"explanation":"وجود % قبل الكلمة وبعدها يسمح بوجود أحرف قبلها وبعدها.\n\n**"},{"q":"استخراج الموظفين من قسمين\nتريد عرض الموظفين الذين ينتمون إلى القسم 2 أو القسم 4. ما الاستعلام الأفضل؟","o":["`SELECT * FROM employees WHERE department_id IN (2,4);`","`SELECT * FROM employees WHERE department_id BETWEEN 2 AND 4;`","`SELECT * FROM employees WHERE department_id LIKE (2,4);`","`SELECT * FROM employees WHERE department_id = 2 AND 4;`"],"a":[0],"explanation":"IN تبحث عن القيم الموجودة ضمن قائمة محددة.\n\n**"},{"q":"حساب المبيعات حسب كل شهر\nمتجر يريد معرفة مجموع المبيعات لكل شهر. جدول sales يحتوي على sale_date وamount. ما الاستعلام المناسب؟","o":["`SELECT MONTH(sale_date), SUM(amount) FROM sales GROUP BY MONTH(sale_date);`","`SELECT MONTH(sale_date), COUNT(amount) FROM sales;`","`SELECT SUM(amount) FROM sales WHERE MONTH(sale_date);`","`SELECT * FROM sales ORDER BY amount;`"],"a":[0],"explanation" const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>{document.querySelectorAll('section').forEach(e=>e.hidden=e.id!==id);scrollTo(0,0)};
const deckKey=()=>document.querySelector('input[name=deck]:checked').value;
let S;
function upd(){const d=DB[deckKey()];$('#total').textContent='اختبار '+d.name+': '+d.q.length+' سؤالاً.'}
document.querySelectorAll('input[name=deck]').forEach(e=>e.onchange=upd);upd();
function start(){
  const d=DB[deckKey()];
  let items=d.q.map(q=>({q:q.q,explanation:q.explanation||'',o:q.o.map((t,k)=>({t,c:q.a.includes(k)}))}));
  if($('#sq').checked)items=sh(items);
  if($('#so').checked)items.forEach(it=>{if(it.o.length<3)return;const last=d.fix?it.o[it.o.length-1]:null;const pn=o=>o===last||/^(Aucun|Tous|Les deux)/.test(o.t);it.o=sh(it.o.filter(o=>!pn(o))).concat(it.o.filter(pn))});
  S={d,mode:document.querySelector('input[name=mode]:checked').value,items,i:0,pick:items.map(()=>[]),done:items.map(()=>false)};
  render();show('quiz');
}
function opt(o,k,cls){
  const b=document.createElement('button');b.className='opt '+(cls||'');
  const fr=S.d.lang==='fr';b.dir=fr?'ltr':'rtl';
  const l=document.createElement('b');l.textContent=fr?'ABCDE'[k]:L[k];
  const s=document.createElement('span');s.textContent=o.t;
  b.append(l,s);return b;
}
function goodCurrent(it,p){return it.o.every((o,k)=>o.c===p.includes(k))}
function render(){
  const n=S.items.length,it=S.items[S.i],p=S.pick[S.i],prac=S.mode==='practice',dn=prac&&S.done[S.i],mu=S.d.multi;
  $('#cnt').textContent='السؤال '+(S.i+1)+' من '+n;
  $('#md').textContent=S.d.name+' · '+(prac?'وضع التدريب':'وضع الامتحان');
  $('#bar').style.width=(S.i/n*100)+'%';
  $('#qt').textContent=it.q;$('#qt').dir=S.d.lang==='fr'?'ltr':'rtl';$('#hint').hidden=!mu;
  const box=$('#opts');box.innerHTML='';
  it.o.forEach((o,k)=>{
    const on=p.includes(k);let cls='';
    if(dn)cls=o.c?'ok':(on?'bad':'');else if(on)cls='sel';
    const b=opt(o,k,cls);b.disabled=dn;
    b.onclick=()=>{
      if(mu)S.pick[S.i]=on?p.filter(x=>x!==k):p.concat(k);
      else{S.pick[S.i]=[k];if(prac)S.done[S.i]=true}
      render();
    };
    box.appendChild(b);
  });
  const fb=$('#feedback');
  fb.hidden=!(dn && p.length);
  fb.className='feedback'+(dn && !goodCurrent(it,p)?' wrong':'');
  if(!fb.hidden){
    const correct=it.o.filter(o=>o.c).map(o=>o.t).join('، ');
    const parts=[goodCurrent(it,p)?'إجابة صحيحة!':'إجابة غير صحيحة. الجواب الصحيح: '+correct];
    if(it.explanation) parts.push('التفسير: '+it.explanation);
    fb.textContent=parts.join('\n');
  }
  $('#prev').disabled=S.i===0;
  $('#next').disabled=!p.length;
  $('#next').textContent=(prac&&mu&&!dn)?'تأكيد الجواب':(S.i===n-1?'إنهاء الاختبار':'السؤال التالي');
}
$('#next').onclick=()=>{
  if(S.mode==='practice'&&S.d.multi&&!S.done[S.i]){S.done[S.i]=true;render();return}
  S.i<S.items.length-1?(S.i++,render(),scrollTo(0,0)):finish();
};
$('#prev').onclick=()=>{S.i--;render();scrollTo(0,0)};
const good=i=>S.items[i].o.every((o,k)=>o.c===S.pick[i].includes(k));
function finish(){
  const n=S.items.length,c=S.items.filter((_,i)=>good(i)).length,pc=Math.round(c/n*100);
  $('#pct').textContent=pc+'%';
  $('#sc').textContent=c+' / '+n;$('#cn').textContent=c;$('#wn').textContent=n-c;
  $('#msg').textContent=pc>=80?'ممتاز، نتيجة رائعة!':pc>=50?'نتيجة جيدة، يمكنك التحسن أكثر.':'حاول مرة أخرى، التكرار يصنع الفرق.';
  $('#onlyw').checked=false;review();show('result');
}
function review(){
  const box=$('#rev');box.innerHTML='';
  S.items.forEach((it,i)=>{
    const g=good(i);
    if($('#onlyw').checked&&g)return;
    const d=document.createElement('div');d.className='card rev '+(g?'ok':'bad');
    const h=document.createElement('h3');h.textContent=(i+1)+'. '+it.q;h.dir=S.d.lang==='fr'?'ltr':'rtl';d.appendChild(h);
    it.o.forEach((o,k)=>{
      const on=S.pick[i].includes(k);
      const b=opt(o,k,o.c?'ok':(on?'bad':''));b.disabled=true;
      const t=document.createElement('span');t.className='tag';
      t.textContent=o.c?'الجواب الصحيح':(on?'جوابك':'');
      b.appendChild(t);d.appendChild(b);
    });
    if(it.explanation){
      const fb=document.createElement('div');fb.className='feedback'+(g?'':' wrong');
      const correct=it.o.filter(o=>o.c).map(o=>o.t).join('، ');
      fb.textContent='الجواب الصحيح: '+correct+'\nالتفسير: '+it.explanation;
      d.appendChild(fb);
    }
    box.appendChild(d);
  });
  if(!box.children.length)box.innerHTML='<div class="card">لا توجد أخطاء، أحسنت!</div>';
}
$('#onlyw').onchange=review;
$('#go').onclick=start;$('#retry').onclick=start;$('#settings').onclick=()=>show('home');
</script>
