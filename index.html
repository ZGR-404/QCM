<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار QCM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--pr:#2f5fd0;--prt:#fff;--ok:#1e9e4f;--okb:#e1f5e9;--bad:#d1342f;--badb:#fbe5e4;--sel:#e6edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#9aa5b1;--bd:#333a45;--pr:#6c93f0;--prt:#0f1420;--ok:#4cc982;--okb:#16341f;--bad:#f2706b;--badb:#3b1d1c;--sel:#232d45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 "Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 14px;line-height:1.6}
p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
label.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
label.row small{display:block;color:var(--mu);font-size:14px}
input{accent-color:var(--pr);width:20px;height:20px;margin-top:5px;flex:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:11px 22px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:15px;margin-bottom:8px}
.track{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
#bar{height:100%;width:0;background:var(--pr);transition:width .3s}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.sel{background:var(--sel);border-color:var(--pr)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{background:var(--badb);border-color:var(--bad)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:14px 0}
.stats div{background:var(--bg);border-radius:12px;padding:12px 4px}
.stats strong{display:block;font-size:26px}.g{color:var(--ok)}.r{color:var(--bad)}
.big{font-size:44px;font-weight:700;text-align:center;margin:0}
.rev{border-inline-start:5px solid var(--bd)}.rev.ok{border-color:var(--ok)}.rev.bad{border-color:var(--bad)}
h2#qt,.rev h3{white-space:pre-line}
.rev h3{font-size:17px;margin:0 0 10px}
.rev .opt{padding:8px 12px;margin-bottom:6px;font-size:16px}
.tag{font-size:13px;margin-inline-start:auto;flex:none;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>اختبار QCM</h1>
  <p class="sub" id="total"></p>
  <div class="card">
    <h2>نوع الاختبار</h2>
    <label class="row"><input type="radio" name="deck" value="clerk" checked><span>محرر قضائي<small>80 سؤالاً، يمكن اختيار أكثر من جواب.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="police"><span>ضابط شرطة<small>50 سؤالاً، جواب واحد لكل سؤال.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="sn"><span>نموذج عام: مباراة الأمن الوطني<small>200 سؤال، جواب واحد لكل سؤال، ثقافة عامة وقانون.</small></span></label>
    <label class="row"><input type="radio" name="deck" value="db"><span>Data Base<small>30 سؤالاً بالفرنسية حول MySQL، جواب واحد لكل سؤال.</small></span></label>
  </div>
  <div class="card">
    <h2>طريقة الاختبار</h2>
    <label class="row"><input type="radio" name="mode" value="practice" checked><span>وضع التدريب<small>يظهر اللون الأخضر أو الأحمر فور اختيارك للجواب، مع إظهار الجواب الصحيح.</small></span></label>
    <label class="row"><input type="radio" name="mode" value="exam"><span>وضع الامتحان<small>لا يظهر أي تصحيح أثناء الاختبار، ويُعرض كل شيء في النهاية.</small></span></label>
  </div>
  <div class="card">
    <h2>الخلط</h2>
    <label class="row"><input type="checkbox" id="sq" checked><span>خلط ترتيب الأسئلة</span></label>
    <label class="row"><input type="checkbox" id="so" checked><span>خلط ترتيب الاختيارات</span></label>
  </div>
  <button class="btn" id="go" style="width:100%;font-size:18px">ابدأ الاختبار</button>
</section>

<section id="quiz" hidden>
  <div class="meta"><span id="cnt"></span><span id="md"></span></div>
  <div class="track"><div id="bar"></div></div>
  <p class="sub" id="hint" style="margin:0 0 10px" hidden>يمكن اختيار أكثر من جواب، ثم اضغط «تأكيد الجواب» في وضع التدريب.</p>
  <div class="card"><h2 id="qt"></h2><div id="opts"></div></div>
  <div class="nav"><button class="btn ghost" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
</section>

<section id="result" hidden>
  <div class="card">
    <p class="big" id="pct"></p>
    <p style="text-align:center;margin:0;color:var(--mu)" id="msg"></p>
    <div class="stats">
      <div><strong id="sc"></strong>النتيجة</div>
      <div><strong class="g" id="cn"></strong>صحيحة</div>
      <div><strong class="r" id="wn"></strong>خاطئة</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="retry">إعادة الاختبار</button><button class="btn ghost" id="settings">تغيير الإعدادات</button></div>
  </div>
  <h2>التصحيح</h2>
  <label class="row" style="padding-top:0"><input type="checkbox" id="onlyw"><span>إظهار الأسئلة الخاطئة فقط</span></label>
  <div id="rev"></div>
</section>
</main>
<script>
const DB={"clerk":{"name":"محرر قضائي","multi":true,"fix":true,"q":[{"q":"يثار الدفع بعدم الاختصاص المكاني في طور الاستئناف:","o":["بالنسبة للأحكام الحضورية","بالنسبة للأحكام النهائية","بالنسبة للأحكام الغيابية","جميع الأجوبة خاطئة"],"a":[2]},{"q":"يجب أن تبلغ إلى النيابة العامة بمجرد تقييدها الدعاوى:","o":["المتعلقة بمخاصمة القضاة","المتعلقة بعدم الاختصاص النوعي","المتعلقة بتنازع القوانين","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تتضمن الأحكام القضائية وجوبا البيانات التالية:","o":["باسم جلالة الملك وطبقا للقانون","المحكمة المصدرة للحكم","اسم كاتب الضبط","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"الدفع بعدم الاختصاص المكاني أمام المحكمة الابتدائية:","o":["يمكن إثارته تلقائيا من طرف المحكمة المختصة","يشترط أن يثار قبل كل دفع أو دفاع في الجوهر","يشترط بيان المحكمة المختصة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"يسلم الاستدعاء مرفقا بنسخة من مقال الدعوى إلى الشخص:","o":["نفسه في موطنه الحقيقي","نفسه في موطنه المختار","لكل شخص يسكن معه","جميع الأجوبة خاطئة"],"a":[0,1,2]},{"q":"يجب أن يفصل بين يوم تسليم الاستدعاء للشاهد المقيم بدائرة نفوذ المحكمة وتاريخ الجلسة:","o":["خمسة أيام","عشرة أيام","خمسة عشر يوماً","جميع الأجوبة خاطئة"],"a":[0]},{"q":"يمكن تجريح الخبير الذي لم يعين باتفاق الأطراف:","o":["إذا عين لإنجاز خبرة في غير مجال تخصصه","إذا كان زوجه دائنا لأحد أطراف الدعوى","بطلب من الخبير نفسه","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"يعتبر من بين إجراءات التحقيق في الدعوى المدنية:","o":["الخبرة","اليمين","البحث التمهيدي","جميع الأجوبة خاطئة"],"a":[0,1]},{"q":"تكون المسطرة شفوية أمام المحكمة الابتدائية في:","o":["قضايا الحالة المدنية","قضايا الإفراغ في عقود الكراء السكني","قضايا النفقة","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"يجوز تبليغ الاستدعاء قبل الساعة السابعة صباحا، بناء على إذن مكتوب من طرف:","o":["رئيس المحكمة","وكيل الملك","القاضي المقرر","جميع الأجوبة خاطئة"],"a":[0,2]},{"q":"تضم لجنة التنسيق على صعيد كل محكمة من الدرجة الأولى:","o":["الرئيس الأول لمحكمة الاستئناف","ممثل المصالح اللاممركزة لوزارة العدل","رئيس المحكمة","جميع الأجوبة خاطئة"],"a":[1,2]},{"q":"تضم لجنة ب const $=s=>document.querySelector(s),L=['أ','ب','ج','د','هـ'];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>{document.querySelectorAll('section').forEach(e=>e.hidden=e.id!==id);scrollTo(0,0)};
const deckKey=()=>document.querySelector('input[name=deck]:checked').value;
let S;
function upd(){const d=DB[deckKey()];$('#total').textContent='اختبار '+d.name+': '+d.q.length+' سؤالاً.'}
document.querySelectorAll('input[name=deck]').forEach(e=>e.onchange=upd);upd();
function start(){
  const d=DB[deckKey()];
  let items=d.q.map(q=>({q:q.q,o:q.o.map((t,k)=>({t,c:q.a.includes(k)}))}));
  if($('#sq').checked)items=sh(items);
  if($('#so').checked)items.forEach(it=>{if(it.o.length<3)return;const last=d.fix?it.o[it.o.length-1]:null;const pn=o=>o===last||/^(Aucun|Tous|Les deux)/.test(o.t);it.o=sh(it.o.filter(o=>!pn(o))).concat(it.o.filter(pn))});
  S={d,mode:document.querySelector('input[name=mode]:checked').value,items,i:0,pick:items.map(()=>[]),done:items.map(()=>false)};
  render();show('quiz');
}
function opt(o,k,cls){
  const b=document.createElement('button');b.className='opt '+(cls||'');
  const fr=S.d.lang==='fr';b.dir=fr?'ltr':'rtl';
  const l=document.createElement('b');l.textContent=fr?'ABCDE'[k]:L[k];
  const s=document.createElement('span');s.textContent=o.t;
  b.append(l,s);return b;
}
function render(){
  const n=S.items.length,it=S.items[S.i],p=S.pick[S.i],prac=S.mode==='practice',dn=prac&&S.done[S.i],mu=S.d.multi;
  $('#cnt').textContent='السؤال '+(S.i+1)+' من '+n;
  $('#md').textContent=S.d.name+' · '+(prac?'وضع التدريب':'وضع الامتحان');
  $('#bar').style.width=(S.i/n*100)+'%';
  $('#qt').textContent=it.q;$('#qt').dir=S.d.lang==='fr'?'ltr':'rtl';$('#hint').hidden=!mu;
  const box=$('#opts');box.innerHTML='';
  it.o.forEach((o,k)=>{
    const on=p.includes(k);let cls='';
    if(dn)cls=o.c?'ok':(on?'bad':'');else if(on)cls='sel';
    const b=opt(o,k,cls);b.disabled=dn;
    b.onclick=()=>{
      if(mu)S.pick[S.i]=on?p.filter(x=>x!==k):p.concat(k);
      else{S.pick[S.i]=[k];if(prac)S.done[S.i]=true}
      render();
    };
    box.appendChild(b);
  });
  $('#prev').disabled=S.i===0;
  $('#next').disabled=!p.length;
  $('#next').textContent=(prac&&mu&&!dn)?'تأكيد الجواب':(S.i===n-1?'إنهاء الاختبار':'السؤال التالي');
}
$('#next').onclick=()=>{
  if(S.mode==='practice'&&S.d.multi&&!S.done[S.i]){S.done[S.i]=true;render();return}
  S.i<S.items.length-1?(S.i++,render(),scrollTo(0,0)):finish();
};
$('#prev').onclick=()=>{S.i--;render();scrollTo(0,0)};
const good=i=>S.items[i].o.every((o,k)=>o.c===S.pick[i].includes(k));
function finish(){
  const n=S.items.length,c=S.items.filter((_,i)=>good(i)).length,pc=Math.round(c/n*100);
  $('#pct').textContent=pc+'%';
  $('#sc').textContent=c+' / '+n;$('#cn').textContent=c;$('#wn').textContent=n-c;
  $('#msg').textContent=pc>=80?'ممتاز، نتيجة رائعة!':pc>=50?'نتيجة جيدة، يمكنك التحسن أكثر.':'حاول مرة أخرى، التكرار يصنع الفرق.';
  $('#onlyw').checked=false;review();show('result');
}
function review(){
  const box=$('#rev');box.innerHTML='';
  S.items.forEach((it,i)=>{
    const g=good(i);
    if($('#onlyw').checked&&g)return;
    const d=document.createElement('div');d.className='card rev '+(g?'ok':'bad');
    const h=document.createElement('h3');h.textContent=(i+1)+'. '+it.q;h.dir=S.d.lang==='fr'?'ltr':'rtl';d.appendChild(h);
    it.o.forEach((o,k)=>{
      const on=S.pick[i].includes(k);
      const b=opt(o,k,o.c?'ok':(on?'bad':''));b.disabled=true;
      const t=document.createElement('span');t.className='tag';
      t.textContent=o.c?'الجواب الصحيح':(on?'جوابك':'');
      b.appendChild(t);d.appendChild(b);
    });
    box.appendChild(d);
  });
  if(!box.children.length)box.innerHTML='<div class="card">لا توجد أخطاء، أحسنت!</div>';
}
$('#onlyw').onchange=review;
$('#go').onclick=start;$('#retry').onclick=start;$('#settings').onclick=()=>show('home');
</script>
